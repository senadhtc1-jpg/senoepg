name: Update SenoEPG BiH

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download and rebuild BiH EPG
        run: python update_epg.py

      - name: Commit updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add senoepg-bih.xml senoepg-bih.xml.gz

          if git diff --cached --quiet; then
            echo "No EPG changes to commit."
            exit 0
          fi

          git commit -m "Auto-update BiH EPG"
          git push
