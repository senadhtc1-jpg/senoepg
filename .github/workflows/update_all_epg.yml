name: Update SenoEPG ALL

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  update-all:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build combined EPG
        run: python build_all_epg.py

      - name: Commit updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add senoepg-all.xml senoepg-all.xml.gz
          git diff --cached --quiet && exit 0
          git commit -m "Update combined BA HR RS EPG"
          git pull --rebase origin main
          git push
