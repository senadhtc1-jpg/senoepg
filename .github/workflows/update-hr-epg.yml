name: Update SenoEPG HR

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"

permissions:
  contents: write

jobs:
  update-epg-hr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download and rebuild HR EPG
        run: python update_hr_epg.py

      - name: Commit updated HR EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add senoepg-hr.xml senoepg-hr.xml.gz

          if git diff --cached --quiet; then
            echo "No HR EPG changes to commit."
            exit 0
          fi

          git commit -m "Auto-update HR EPG"
          git push
